# Prometheus Configuration for Manus AI Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'manus-ai'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Manus AI API metrics
  - job_name: 'manus_ai_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MongoDB exporter (optional - requires mongodb_exporter container)
  # - job_name: 'mongodb'
  #   static_configs:
  #     - targets: ['mongodb_exporter:9216']

  # Redis exporter (optional - requires redis_exporter container)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis_exporter:9121']

  # Qdrant metrics (if exposed)
  # - job_name: 'qdrant'
  #   static_configs:
  #     - targets: ['qdrant:6333']
  #   metrics_path: '/metrics'
